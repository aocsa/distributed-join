[workspace]
name = "distributed-join"
channels = ["rapidsai", "conda-forge", "nvidia"]
platforms = ["linux-64"]

# RAPIDS 23.08 is the oldest release with CUDA 12 builds and the last whose rmm/cudf APIs are
# close to the cuDF 0.19 this code was written against. Its nvcc (12.2) supports at most GCC 12.
[dependencies]
cmake = ">=3.26"
ninja = "*"
cxx-compiler = "*"
gxx = "12.*"
cuda-version = "12.2.*"
cuda-nvcc = "12.2.*"
cuda-cudart-dev = "12.2.*"
cuda-nvrtc-dev = "12.2.*"
cuda-cccl = "12.2.*"
cuda-profiler-api = "12.2.*"
libcurand-dev = "*"
libcudf = "23.08.*"
librmm = "23.08.*"
nvcomp = "2.6.1.*"
nccl = "*"
ucx = "*"
openmpi = "*"

[activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
